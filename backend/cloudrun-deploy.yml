name: Deploy Bhirithi Gemini Backend

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/cloudrun-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy bhirithi-gemini-backend             --source backend             --region "${{ secrets.GCP_REGION }}"             --project "${{ secrets.GCP_PROJECT_ID }}"             --allow-unauthenticated             --set-env-vars "GEMINI_MODEL=gemini-3.5-flash,MAX_REQUESTS_PER_MINUTE=30"             --set-env-vars "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"
